- tag: NAS
  title: NAS 与家庭存储：设备体验、备份与远程访问
  heading: 围绕家里的数据与服务选择 NAS
  description: 镜湖的 NAS 与家庭存储目录，汇集设备体验、QNAP、懒猫微服、Mac 备份和云端存储实践，从实际需求理解家庭服务的搭建与维护。
  paragraphs:
    - NAS 的选择可以先从数据和使用方式开始：家里有多少设备，需要保存哪些文件，是否要运行自己的服务，以及怎样在设备出问题时取回数据。这里保留了我对这些问题的思考，也收集了不同设备的实际体验。
    - 可以先读需求梳理，再看设备和备份方案。测速记录对应当时的硬件、网络和文件场景；把照片或工作资料长期放进去之前，还需要考虑独立备份与恢复流程。懒猫微服和云端存储的文章也放在这里交叉查阅。
