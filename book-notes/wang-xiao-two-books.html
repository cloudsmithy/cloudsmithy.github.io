.tb.on{color:var(--ink);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}

.solo{margin-left:auto;font-size:12px;color:var(--ink2);text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px}
.solo:hover{background:var(--line)}

iframe.on{display:block}
