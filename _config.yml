title: 镜湖
subtitle: "前 AWS 技术支持的云端与家庭机房实践"
description: "忘机山人的技术博客。前 AWS 技术支持，家里自建数据中心，为亚马逊云科技、极限科技与懒猫微服供稿。记录 AWS、Docker、NAS、搜索引擎和 AI 部署的实际配置、排查与取舍。"
home_intro: "前 AWS 技术支持，家里自建数据中心。为亚马逊云科技、极限科技和懒猫微服写稿，也在这里记录从云端到家用 NAS 的折腾。"
keywords:
  - 博客
  - 技术
  - 生活
  - AWS
  - Docker
  - NAS
  - 懒猫微服
  - Easysearch
  - OpenSearch
  - Python
  - Homelab
  - Linux
  - Milvus
  - AI
  - 3D打印
  - 散文
author: 忘机山人
language: zh-CN
timezone: "Asia/Shanghai"
url: https://blog.no-claw.com
root: /
permalink: :abbrlink/

# URL
## If your site is put in a subdirectory, set url as 'http://example.com/project' and root as '/project/'
abbrlink:
  alg: crc32 # 算法：crc16(default) or crc32
  rep: hex # 进制：dec(default) or hex
  use_map: true
pretty_urls:
  trailing_index: false
  trailing_html: false
  drafts: false # 是否为草稿生成 abbrlink
  # 从 Front Matter 中获取 abbrlink
  enable_category: false
  enable_title: false
  enable_date: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ":lang"
skip_render:
  - "_posts/**/Readme.md"
  - "_posts/**/index.md"
  - "_posts/**/后记.md"
  - "_posts/**/序.md"
  - "googlea37b65ccf0f77745.html"
  - "sw.js"
  - "manifest.json"
  - "daily-routine.html"
new_post_name: ":title.md"
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ""
  per_page: 10
  order_by: "-date"
default_category: uncategorized
category_map: null
# 显示名称统一后保留旧标签 URL，兼容收藏和站外链接。
tag_map:
  Git: GIT
  搜索引擎: 搜索引擎（ES）
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: empty
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: butterfly

deploy:
  type: ""
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
  content_limit: 140
  content_limit_delim: " "
sitemap:
  path: sitemap.xml
  # scripts/tag-directory.js restricts tag entries to source/_data/tag_landings.yml.
  tags: true
  categories: true
nofollow:
  enable: true
  field: site
  exclude:
    - blog.no-claw.com
robotstxt:
  useragent: "*"
  disallow:
    - /drafts/
  allow:
    - /
  sitemap: https://blog.no-claw.com/sitemap.xml

# Local search
search:
  path: search.xml
  field: post
  content: true
  format: html



# hexo-minify: 压缩 HTML/CSS/JS/SVG
minify:
  preview: false
  exclude: 
    - "*.min.*"
    - "docs/*"
  js:
    enable: true
    sourceMap:
      enable: false
    options: {}
  css:
    enable: true
    options: {}
  html:
    enable: true
    options:
      minifyJS: true
      minifyCSS: true
      removeComments: true
      collapseWhitespace: true
      removeAttributeQuotes: true
  svg:
    enable: true
    options: {}
  image:
    enable: false
  font:
    enable: false
